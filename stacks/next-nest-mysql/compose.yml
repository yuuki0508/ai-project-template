name: __PROJECT_SLUG__

# 認証情報はすべて .env を唯一の置き場とし、ここでは参照だけする。
# ${VAR:?...} は未設定なら起動させずエラーにする記法。
#
# user: はWSL2対策。rootで npm install するとホスト側のファイルが
# root所有になり、エディタから保存できなくなる。
x-node: &node
  image: __NODE_IMAGE__
  user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
  tty: true

services:
  web:
    <<: *node
    working_dir: /app/web
    command: sh -c "npm install && npm run dev -- -p 3000"
    ports:
      - "__PORT_WEB__:3000"
    volumes:
      - ./web:/app/web
    environment:
      TZ: Asia/Tokyo
      HOME: /tmp
      NEXT_PUBLIC_API_URL: http://localhost:__PORT_API__
      INTERNAL_API_URL: http://api:4000
    depends_on:
      - api

  api:
    <<: *node
    working_dir: /app/api
    command: sh -c "npm install && npx prisma generate && npm run start:dev"
    ports:
      - "__PORT_API__:4000"
    volumes:
      - ./api:/app/api
    env_file:
      - .env
    environment:
      TZ: Asia/Tokyo
      HOME: /tmp
      PORT: 4000
      # env_file は変数展開しないため、接続URLはここで組み立てる。
      # これでパスワードの記述箇所は .env の1行だけになる。
      DATABASE_URL: "mysql://${DB_USERNAME:?.env に DB_USERNAME がありません}:${DB_PASSWORD:?.env に DB_PASSWORD がありません}@db:3306/${DB_DATABASE:?.env に DB_DATABASE がありません}"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    ports:
      - "__PORT_DB__:3306"
    environment:
      MYSQL_DATABASE: "${DB_DATABASE:?.env に DB_DATABASE がありません}"
      MYSQL_USER: "${DB_USERNAME:?.env に DB_USERNAME がありません}"
      MYSQL_PASSWORD: "${DB_PASSWORD:?.env に DB_PASSWORD がありません}"
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:?.env に DB_ROOT_PASSWORD がありません}"
      TZ: Asia/Tokyo
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    ports:
      - "__PORT_PMA__:80"
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:?.env に DB_ROOT_PASSWORD がありません}"
      UPLOAD_LIMIT: 256M
      TZ: Asia/Tokyo
    depends_on:
      db:
        condition: service_healthy

  mail:
    image: axllent/mailpit:latest
    ports:
      - "__PORT_MAIL__:8025"

volumes:
  db-data:
